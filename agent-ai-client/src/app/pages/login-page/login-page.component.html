<div class="login-page">
    @if (!isRegisterMode) {
        <div class="login-container">
            <div class="card flex justify-center m-2">
                        <p-floatlabel  variant="on">
                            <input id="username" pInputText [(ngModel)]="userLoginModel.username" autocomplete="off" />
                            <label for="username">{{ 'login.username' | translate }}</label>
                        </p-floatlabel>
            </div>
            <div class="card flex justify-center m-2">
                <p-floatlabel variant="on">
                                <p-password [(ngModel)]="userLoginModel.password" [feedback]="false" [toggleMask]="true" inputId="on_label" autocomplete="off" />
                                <label for="on_label">{{ 'login.password' | translate }}</label>
                </p-floatlabel>
            </div>
            <div class="card flex justify-center m-2">
                <p-button (onClick)="onLoginClick()" label="{{ 'buttons.login' | translate }}" />
            </div>
            <div class="card flex justify-center m-2">
                <a class="pointer" (click)="isRegisterMode = true">{{ 'login.registerQuestion' | translate }}</a>
            </div>
        </div>
    } @else {
        <div class="login-container">
             <div class="card flex justify-center m-2">
                        <p-floatlabel  variant="on">
                            <input id="username" pInputText [(ngModel)]="userLoginModel.email" autocomplete="off" />
                            <label for="username">{{ 'login.email' | translate }}</label>
                        </p-floatlabel>
            </div>
            <div class="card flex justify-center m-2">
                        <p-floatlabel  variant="on">
                            <input id="username" pInputText [(ngModel)]="userLoginModel.username" autocomplete="off" />
                            <label for="username">{{ 'login.username' | translate }}</label>
                        </p-floatlabel>
            </div>
            <div class="card flex justify-center m-2">
                <p-floatlabel variant="on">
                                <p-password [(ngModel)]="userLoginModel.password"  inputId="passwordId" autocomplete="off" />
                                <label for="passwordId">{{ 'login.password' | translate }}</label>
                </p-floatlabel>
            </div>
            <div class="card flex justify-center m-2">
                <p-floatlabel variant="on">
                                <p-password [(ngModel)]="repeatPassword" [feedback]="false" inputId="repeatPsswordId" autocomplete="off" />
                                <label for="repeatPsswordId">{{ 'login.repeatPassword' | translate }}</label>
                </p-floatlabel>
            </div>
            <div class="card flex justify-center m-2">
                <p-button (onClick)="onRegisterClick()" label="{{ 'buttons.register' | translate }}" />
            </div>
        </div>
    }
</div>
