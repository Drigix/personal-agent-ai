<p-card [header]="'profile.userData' | translate" subHeader="Manage your account information" [style]="{ width: '100%', maxWidth: '600px', margin: '0 auto' }">
    <ng-template pTemplate="header">
        <div class="flex flex-column align-items-center justify-content-center p-4 bg-primary-reverse">
            <h2 class="mt-3 mb-0">Amy Elsner</h2>
            <span class="text-secondary">amy@example.com</span>
        </div>
    </ng-template>
    
    <div class="p-fluid grid formgrid mt-3">
        <div class="field col-12 md:col-6 mb-4">
            <p-floatlabel  variant="on">
                <input id="username" pInputText [(ngModel)]="userData().username" autocomplete="off" />
                <label for="username">{{ 'login.username' | translate }}</label>
            </p-floatlabel>
        </div>
        <div class="field col-12 mb-4">
            <p-floatlabel  variant="on">
                <input id="email" pInputText [disabled]="true" [(ngModel)]="userData().email" type="text" />
                <label for="email">{{ 'login.email' | translate }}</label>
            </p-floatlabel>
        </div>
    </div>

    <ng-template #footer>
        <div class="flex justify-content-end gap-3">
            <!-- <p-button label="Cancel" severity="secondary" icon="pi pi-times"></p-button> -->
            <p-button [label]="'buttons.saveChanges' | translate" icon="pi pi-check" (click)="saveChanges()"></p-button>
        </div>
    </ng-template>
</p-card>
