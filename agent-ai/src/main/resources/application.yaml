spring:
  application:
    name: agent-ai
  config:
    import: optional:file:.env[.properties]
  mongodb:
    url: ${DB_URL}
    database: chat_memory_db

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: DEBUG

server:
  port: 8081

client:
  url: http://localhost:4200

ollama:
  model: llama3.2
  embeddingModel: nomic-embed-text
  host: http://localhost:11434
  timeout: 60
  memory:
    maxMessage: 20

jwt:
  secret: ${JWT_SECRET}